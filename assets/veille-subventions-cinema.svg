<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="Film funding tracker: grant deadlines extracted and checked automatically">
  <style>
    .sans { font-family: 'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
  </style>
  <rect width="480" height="270" rx="18" fill="#131518"/>
  <rect x="0.5" y="0.5" width="479" height="269" rx="17.5" fill="none" stroke="#2C3036"/>

  <!-- Pellicule -->
  <g transform="translate(36 34)">
    <rect x="0" y="0" width="46" height="150" rx="6" fill="#1C1F24" stroke="#2C3036"/>
    <rect x="6" y="10" width="8" height="10" rx="2" fill="#3A3F46"/><rect x="32" y="10" width="8" height="10" rx="2" fill="#3A3F46"/>
    <rect x="6" y="40" width="8" height="10" rx="2" fill="#3A3F46"/><rect x="32" y="40" width="8" height="10" rx="2" fill="#3A3F46"/>
    <rect x="6" y="70" width="8" height="10" rx="2" fill="#3A3F46"/><rect x="32" y="70" width="8" height="10" rx="2" fill="#3A3F46"/>
    <rect x="6" y="100" width="8" height="10" rx="2" fill="#3A3F46"/><rect x="32" y="100" width="8" height="10" rx="2" fill="#3A3F46"/>
    <rect x="6" y="130" width="8" height="10" rx="2" fill="#3A3F46"/><rect x="32" y="130" width="8" height="10" rx="2" fill="#3A3F46"/>
  </g>

  <!-- Calendrier -->
  <g transform="translate(106 34)" class="sans">
    <rect x="0" y="0" width="200" height="150" rx="12" fill="#1C1F24" stroke="#2C3036"/>
    <rect x="0" y="0" width="200" height="30" rx="12" fill="#2C3036"/>
    <rect x="0" y="18" width="200" height="12" fill="#2C3036"/>
    <text x="16" y="20" font-size="12" font-weight="600" fill="#ECE9E4">October</text>
    <g fill="#3A3F46">
      <rect x="14" y="44" width="20" height="16" rx="4"/><rect x="40" y="44" width="20" height="16" rx="4"/><rect x="66" y="44" width="20" height="16" rx="4"/><rect x="92" y="44" width="20" height="16" rx="4"/><rect x="118" y="44" width="20" height="16" rx="4"/><rect x="144" y="44" width="20" height="16" rx="4"/><rect x="170" y="44" width="20" height="16" rx="4"/>
      <rect x="14" y="68" width="20" height="16" rx="4"/><rect x="66" y="68" width="20" height="16" rx="4"/><rect x="92" y="68" width="20" height="16" rx="4"/><rect x="118" y="68" width="20" height="16" rx="4"/><rect x="170" y="68" width="20" height="16" rx="4"/>
      <rect x="14" y="92" width="20" height="16" rx="4"/><rect x="40" y="92" width="20" height="16" rx="4"/><rect x="66" y="92" width="20" height="16" rx="4"/><rect x="118" y="92" width="20" height="16" rx="4"/><rect x="144" y="92" width="20" height="16" rx="4"/><rect x="170" y="92" width="20" height="16" rx="4"/>
      <rect x="14" y="116" width="20" height="16" rx="4"/><rect x="40" y="116" width="20" height="16" rx="4"/><rect x="66" y="116" width="20" height="16" rx="4"/><rect x="92" y="116" width="20" height="16" rx="4"/><rect x="144" y="116" width="20" height="16" rx="4"/><rect x="170" y="116" width="20" height="16" rx="4"/>
    </g>
    <!-- échéances : dépôt (orange), décision (clair), étape préalable (contour) -->
    <rect x="40" y="68" width="20" height="16" rx="4" fill="#E5522D"/>
    <rect x="144" y="68" width="20" height="16" rx="4" fill="#E5522D"/>
    <rect x="92" y="92" width="20" height="16" rx="4" fill="#FF8A6B"/>
    <rect x="118" y="116" width="20" height="16" rx="4" fill="none" stroke="#FF8A6B" stroke-width="2"/>
  </g>

  <!-- Vérification -->
  <g transform="translate(330 60)" class="sans">
    <rect x="0" y="0" width="116" height="30" rx="8" fill="#1C1F24" stroke="#2C3036"/>
    <text x="12" y="20" class="mono" font-size="11" fill="#9AA0A6">extract</text>
    <path d="M58 40 v14" stroke="#3A3F46" stroke-width="2"/>
    <rect x="0" y="58" width="116" height="30" rx="8" fill="#1C1F24" stroke="#FF8A6B"/>
    <text x="12" y="78" class="mono" font-size="11" fill="#ECE9E4">verify</text>
    <path d="M92 69 l5 5 l9 -10" stroke="#3FB950" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M58 98 v14" stroke="#3A3F46" stroke-width="2"/>
    <rect x="0" y="116" width="116" height="30" rx="8" fill="#E5522D"/>
    <text x="12" y="136" class="mono" font-size="11" fill="#FFFFFF">.ics</text>
  </g>

  <!-- Chiffres -->
  <text x="36" y="226" class="sans" font-size="26" font-weight="700" fill="#ECE9E4">16</text>
  <text x="36" y="246" class="sans" font-size="12" fill="#9AA0A6">official sources</text>
  <text x="160" y="226" class="sans" font-size="26" font-weight="700" fill="#ECE9E4">0</text>
  <text x="160" y="246" class="sans" font-size="12" fill="#9AA0A6">CSS selectors</text>
  <text x="290" y="226" class="sans" font-size="26" font-weight="700" fill="#ECE9E4">Live</text>
  <text x="290" y="246" class="sans" font-size="12" fill="#9AA0A6">static site demo</text>

  <rect x="388" y="22" width="68" height="22" rx="7" fill="none" stroke="#3A3F46"/>
  <text x="422" y="37" text-anchor="middle" class="mono" font-size="11" fill="#9AA0A6">LLM ops</text>
</svg>
