<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="PSG sports tracker: shot map and expected goals model">
  <style>
    .sans { font-family: 'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
    .line { stroke: #2A3A55; stroke-width: 2; fill: none; }
  </style>
  <rect width="480" height="270" rx="18" fill="#0E1524"/>
  <rect x="0.5" y="0.5" width="479" height="269" rx="17.5" fill="none" stroke="#1F2B40"/>

  <!-- Demi-terrain vu de face, but en haut -->
  <g transform="translate(40 34)">
    <rect class="line" x="0" y="0" width="250" height="150" rx="4"/>
    <rect class="line" x="55" y="0" width="140" height="58"/>
    <rect class="line" x="95" y="0" width="60" height="20"/>
    <rect x="108" y="-6" width="34" height="6" rx="2" fill="#4A5C7A"/>
    <path class="line" d="M95 58 A 34 34 0 0 0 155 58"/>
    <circle cx="125" cy="40" r="2.5" fill="#2A3A55"/>
    <path class="line" d="M85 150 A 40 40 0 0 1 165 150"/>

    <!-- Tirs : taille = xG, plein = but -->
    <circle cx="120" cy="14" r="11" fill="#3B6FD4"/>
    <circle cx="138" cy="26" r="8" fill="#3B6FD4"/>
    <circle cx="104" cy="32" r="7" fill="none" stroke="#7AA7FF" stroke-width="2"/>
    <circle cx="150" cy="44" r="5" fill="none" stroke="#7AA7FF" stroke-width="2"/>
    <circle cx="90" cy="50" r="4" fill="none" stroke="#7AA7FF" stroke-width="2"/>
    <circle cx="128" cy="46" r="6" fill="#3B6FD4"/>
    <circle cx="175" cy="38" r="3.5" fill="none" stroke="#7AA7FF" stroke-width="2"/>
    <circle cx="68" cy="66" r="3" fill="none" stroke="#7AA7FF" stroke-width="2"/>
    <circle cx="110" cy="78" r="3" fill="none" stroke="#7AA7FF" stroke-width="2"/>
    <circle cx="160" cy="84" r="2.5" fill="none" stroke="#7AA7FF" stroke-width="2"/>
    <circle cx="200" cy="60" r="2.5" fill="none" stroke="#7AA7FF" stroke-width="2"/>
    <circle cx="140" cy="100" r="2.5" fill="none" stroke="#7AA7FF" stroke-width="2"/>
  </g>

  <!-- Barres SHAP -->
  <g transform="translate(318 40)" class="sans">
    <text x="0" y="0" class="mono" font-size="11" fill="#8B9AB3">SHAP</text>
    <text x="0" y="26" font-size="11" fill="#8B9AB3">distance</text>
    <rect x="62" y="17" width="60" height="11" rx="3" fill="#3B6FD4"/>
    <text x="0" y="50" font-size="11" fill="#8B9AB3">angle</text>
    <rect x="62" y="41" width="42" height="11" rx="3" fill="#3B6FD4"/>
    <text x="0" y="74" font-size="11" fill="#8B9AB3">header</text>
    <rect x="62" y="65" width="26" height="11" rx="3" fill="#4A5C7A"/>
    <text x="0" y="98" font-size="11" fill="#8B9AB3">foot</text>
    <rect x="62" y="89" width="16" height="11" rx="3" fill="#4A5C7A"/>
  </g>

  <!-- Chiffres -->
  <text x="36" y="226" class="sans" font-size="26" font-weight="700" fill="#E6EDF7">6,283</text>
  <text x="36" y="246" class="sans" font-size="12" fill="#8B9AB3">real shots</text>
  <text x="160" y="226" class="sans" font-size="26" font-weight="700" fill="#E6EDF7">0.772</text>
  <text x="160" y="246" class="sans" font-size="12" fill="#8B9AB3">ROC-AUC (xG)</text>
  <text x="290" y="226" class="sans" font-size="26" font-weight="700" fill="#E6EDF7">2</text>
  <text x="290" y="246" class="sans" font-size="12" fill="#8B9AB3">sources, deduplicated</text>

  <rect x="400" y="22" width="56" height="22" rx="7" fill="none" stroke="#2A3A55"/>
  <text x="428" y="37" text-anchor="middle" class="mono" font-size="11" fill="#8B9AB3">ML</text>
</svg>
