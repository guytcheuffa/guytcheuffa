<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Guy Tcheuffa, Data Scientist and AI Engineer">
  <style>
    .sans { font-family: 'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    .edge { stroke: #2A3A55; stroke-width: 2; fill: none; stroke-dasharray: 6 6; animation: flow 1.6s linear infinite; }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    .live { animation: pulse 2.4s ease-in-out infinite; }
  </style>
  <rect width="1200" height="300" rx="20" fill="#0E1524"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="19.5" fill="none" stroke="#1F2B40"/>

  <!-- Monogramme -->
  <rect x="64" y="86" width="128" height="128" rx="30" fill="#3B6FD4"/>
  <text x="128" y="170" text-anchor="middle" class="sans" font-size="60" font-weight="700" fill="#FFFFFF" letter-spacing="-2">GT</text>

  <!-- Identité -->
  <text x="228" y="132" class="sans" font-size="50" font-weight="700" fill="#E6EDF7" letter-spacing="-1">Guy Tcheuffa</text>
  <text x="230" y="172" class="sans" font-size="22" font-weight="500" fill="#7AA7FF">Data Scientist · AI Engineer</text>
  <text x="230" y="208" class="sans" font-size="17" fill="#8B9AB3">ESIEE Paris engineer in Data Science &amp; AI · UC San Diego exchange</text>

  <!-- Petit graphe de pipeline (DAG) -->
  <g transform="translate(905 70)">
    <path class="edge" d="M20 40 C 70 40, 70 80, 120 80"/>
    <path class="edge" d="M20 120 C 70 120, 70 80, 120 80"/>
    <path class="edge" d="M120 80 L 200 80"/>
    <path class="edge" d="M200 80 C 230 80, 230 30, 260 30"/>
    <path class="edge" d="M200 80 C 230 80, 230 130, 260 130"/>
    <circle cx="20" cy="40" r="9" fill="#172238" stroke="#4A5C7A" stroke-width="2"/>
    <circle cx="20" cy="120" r="9" fill="#172238" stroke="#4A5C7A" stroke-width="2"/>
    <rect x="106" y="66" width="28" height="28" rx="8" fill="#172238" stroke="#7AA7FF" stroke-width="2"/>
    <rect x="186" y="66" width="28" height="28" rx="8" fill="#3B6FD4"/>
    <circle cx="260" cy="30" r="9" fill="#172238" stroke="#4A5C7A" stroke-width="2"/>
    <circle cx="260" cy="130" r="9" fill="#7AA7FF" class="live"/>
    <text x="20" y="170" class="mono" font-size="12" fill="#4A5C7A">ingest</text>
    <text x="104" y="170" class="mono" font-size="12" fill="#4A5C7A">model</text>
    <text x="186" y="170" class="mono" font-size="12" fill="#4A5C7A">eval</text>
    <text x="236" y="170" class="mono" font-size="12" fill="#4A5C7A">ship</text>
  </g>

  <!-- Bas de bannière -->
  <circle cx="232" cy="248" r="5" fill="#3FB950" class="live"/>
  <text x="246" y="253" class="sans" font-size="15" fill="#8B9AB3">Open to opportunities in France and abroad · Based in Paris</text>
</svg>
